<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" width="620" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#78838f"/>
    </marker>
  </defs>

  <text x="24" y="28" font-size="14" fill="#78838f">Plan view, north up. Shading runs while the sun is inside the sector.</text>

  <!-- sector wedge -->
  <path d="M 300 120 L 459.4 133.9 A 160 160 0 0 1 140.6 133.9 Z" fill="#d9a441" opacity="0.13"/>
  <line x1="300" y1="120" x2="459.4" y2="133.9" stroke="#d9a441" stroke-width="1.5"/>
  <line x1="300" y1="120" x2="140.6" y2="133.9" stroke="#d9a441" stroke-width="1.5"/>

  <!-- hard limit at +/-90, along the wall -->
  <line x1="300" y1="120" x2="470" y2="120" stroke="#78838f" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="300" y1="120" x2="130" y2="120" stroke="#78838f" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- wall and window -->
  <line x1="150" y1="120" x2="450" y2="120" stroke="#78838f" stroke-width="6"/>
  <line x1="240" y1="120" x2="360" y2="120" stroke="#4b8bbe" stroke-width="7"/>
  <text x="300" y="106" font-size="13" fill="#4b8bbe" text-anchor="middle">window</text>
  <text x="300" y="86" font-size="13" fill="#78838f" text-anchor="middle">room</text>

  <!-- facing direction -->
  <line x1="300" y1="120" x2="300" y2="206" stroke="#4b8bbe" stroke-width="2" marker-end="url(#a2)"/>
  <text x="286" y="226" font-size="13" fill="#4b8bbe" text-anchor="end">azimuth 180 (S)</text>

  <!-- sun -->
  <line x1="413.1" y1="233.1" x2="300" y2="120" stroke="#d9a441" stroke-width="2"/>
  <circle cx="424" cy="244" r="12" fill="none" stroke="#d9a441" stroke-width="2"/>
  <text x="446" y="268" font-size="13" fill="#d9a441">sun azimuth</text>

  <!-- rel angle -->
  <path d="M 300 195 A 75 75 0 0 0 353 173" fill="none" stroke="#3d9970" stroke-width="1.8"/>
  <text x="340" y="206" font-size="15" fill="#3d9970" font-style="italic">rel</text>

  <!-- tolerance labels -->
  <text x="466" y="146" font-size="13" fill="#d9a441">tolStart / tolEnd</text>
  <text x="466" y="164" font-size="13" fill="#d9a441">85°</text>
  <text x="128" y="146" font-size="13" fill="#d9a441" text-anchor="end">85°</text>
  <text x="476" y="116" font-size="12" fill="#78838f">90° hard limit</text>

  <!-- compass -->
  <line x1="64" y1="76" x2="64" y2="40" stroke="#78838f" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="64" y="34" font-size="13" fill="#78838f" text-anchor="middle">N</text>
  <text x="64" y="94" font-size="12" fill="#78838f" text-anchor="middle">0°</text>

  <text x="24" y="318" font-size="13" fill="#78838f">Additionally required: solar elevation above minElev.</text>
</svg>
