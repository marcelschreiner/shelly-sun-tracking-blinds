<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" width="620" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <text x="24" y="30" font-size="14" fill="#78838f">Measure both mechanical end positions once with a spirit level app.</text>
  <text x="24" y="50" font-size="14" fill="#78838f">Positive = the room-side edge points up. Negative values are fine.</text>

  <!-- panel A -->
  <line x1="100" y1="200" x2="250" y2="200" stroke="#78838f" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="146.1" y1="278.8" x2="173.9" y2="121.2" stroke="#3d9970" stroke-width="10" stroke-linecap="round"/>
  <path d="M 210 200 A 50 50 0 0 0 168.7 150.8" fill="none" stroke="#4b8bbe" stroke-width="1.6"/>
  <text x="196" y="168" font-size="15" fill="#4b8bbe">+80°</text>
  <text x="60" y="112" font-size="12" fill="#78838f">room side up</text>
  <text x="160" y="300" font-size="14" fill="#78838f" text-anchor="middle">slat_pos = 0</text>
  <text x="160" y="322" font-size="14" fill="#4b8bbe" text-anchor="middle">angAtPos0 = 80</text>

  <!-- panel B -->
  <line x1="380" y1="200" x2="545" y2="200" stroke="#78838f" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="381.2" y1="186.1" x2="538.8" y2="213.9" stroke="#3d9970" stroke-width="10" stroke-linecap="round"/>
  <path d="M 510 200 A 50 50 0 0 1 509.2 208.7" fill="none" stroke="#4b8bbe" stroke-width="1.6"/>
  <text x="516" y="222" font-size="15" fill="#4b8bbe">−10°</text>
  <text x="378" y="160" font-size="12" fill="#78838f">room side down</text>
  <text x="460" y="300" font-size="14" fill="#78838f" text-anchor="middle">slat_pos = 100</text>
  <text x="460" y="322" font-size="14" fill="#4b8bbe" text-anchor="middle">angAtPos100 = −10</text>

  <!-- divider -->
  <line x1="310" y1="90" x2="310" y2="270" stroke="#78838f" stroke-width="1" opacity="0.35"/>
</svg>
